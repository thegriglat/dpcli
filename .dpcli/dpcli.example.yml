# dpcli config. Put it in the project root as dpcli.yml (or dpcli.json; json takes precedence).
# Searched upward from the current directory to the git root. All keys are optional — defaults below.
# Substitutions in path and branch templates: {project}, {module}, {task}, {copies}.

# Project name (default — directory name of the main worktree).
# project: myproject

# Main branch that modules are merged into.
main_branch: main
# true — dpcli merges (merge/deliver) into main_branch only with explicit --into and only a module created from it:
# the normal path into main is a feature branch MR merged by a human.
protect_main: false
# Module branch.
module_branch: "feature/{module}"
# Task branch (from the module branch).
task_branch: "{module}/{task}"

# Directory where working copies (git worktree) are created.
copies_dir: "~/worktrees"
# Module working copy.
module_copy: "{copies}/{project}/{module}"
# Task working copy.
task_copy: "{copies}/{project}/{module}-{task}"

# Setup of new working copies (module new, task new; rerun — dpcli copy setup [PATH]).
# The copy is created with --no-checkout, git-crypt keys are copied into its GIT_DIR, then checkout.
# Source of the files below — the main copy (first in git worktree list).
worktree:
  # Copy over a relative core.hooksPath (e.g. .husky/_) — it is git-ignored and empty in the copy.
  hooks: true
  # Git-ignored paths of the main copy. Pattern without "/" — by name at any depth, with "/" — from root.
  # Already present in the copy or parent dir missing in the branch — skipped; [] — disable.
  # As hard links (cp -al; on another FS — a copy): own tree, files shared with the main copy.
  link: [node_modules]
  # As a plain copy.
  copy: [.env, ".env.*"]
  # bash command after setup: cwd — the new copy; env DPCLI_COPY, DPCLI_MAIN_COPY, DPCLI_BRANCH.
  # A failure doesn't roll back the copy. Example: "make prepare"
  # setup: "..."
  setup_timeout: 1800

# Module journals and plans: <plan_dir>/<module>/ (cards, reports, events.jsonl, decisions.jsonl).
plan_dir: docs/plan
# Seam contracts: <contracts_dir>/<module>.md.
contracts_dir: docs/contracts
# Documentation directory (INDEX.md, registry/, dpcli docs frontmatter checks).
docs_dir: docs
# Monorepo subprojects (module new --area): whose product goal the module serves; shared code in libs
# doesn't change area. If a list is set — module new/deliver without area refuse (agent asks the developer),
# docs check requires area on module plan/contract/journal; INDEX.md sections — in this order. [] — unused.
areas: []

# Acceptance checks (dpcli accept).
checks:
  # Extra environment variables for check commands (none by default); {tmpdir} — a fresh temp directory.
  # env:
  #   HOME_FOR_TESTS: "{tmpdir}"
  # Command template for checks of the form {tests: …}; {filter} — test filter from the card.
  # Not set — the tests check is unavailable. Example: "python3 -m pytest -q -k {filter}"
  # tests: "python3 -m pytest -q -k {filter}"
  # Regex for the test run summary for {tests: …} checks: groups (?P<total>…) and (?P<failed>…),
  # optionally (?P<skipped>…); the last match is used. No match — judged by exit code.
  # Default — "N tests, M failed[, K skipped]". Regex in single quotes (no \\ escaping).
  # tests_summary: '(?P<total>\d+) tests, (?P<failed>\d+) failed'
  # Where check logs go: <log_dir>/<ID>/.
  log_dir: build/dpcli

# Where agents put screenshots and images (hint in the report template); one subfolder per task.
artifacts_dir: build/artifacts

# Module delivery (dpcli deliver): what from <plan_dir>/<module>/ stays in the target branch after squash
# (the rest of the journal — only in the module branch) and the archive tag on the module branch (false — no tag; null — default).
deliver:
  keep: [decisions.md, summary.md]
  archive_tag: "archive/{module}"

# Reserved module codes (not assigned by module new / task new).
reserved_codes: []

# dpcli gc: what not to count as "uncommitted changes" in copies on removal.
gc:
  ignore_dirs: [build, __pycache__]
  # File name patterns, e.g. ["*.uid"].
  ignore_globs: []

# Semantic search (dpcli index / dpcli search --sem) via Ollama.
sem:
  # Optional: off by default. To enable — enabled: true and Ollama with the model
  # (ollama pull bge-m3). Without it plain search works; merge doesn't touch the index.
  enabled: false
  model: bge-m3
  url: "http://localhost:11434"
  cache_dir: "~/.cache/dpcli/{project}"
  # Index corpus — path patterns from the project root.
  globs:
    - "docs/**/*.md"
    - "CHANGELOG.md"

# Long runs (dpcli job).
jobs:
  dir: "~/.cache/dpcli/{project}/jobs"
  # tmux session for job windows (DPCLI_TMUX_SESSION overrides).
  tmux_session: dp
  # Slots in the cpu lock (default — half of logical cores; DPCLI_CPU_SLOTS overrides).
  # cpu_slots: 8

# Lock directory for dpcli lock cpu|gpu (default — <jobs.dir>/locks).
# locks: "~/.cache/dpcli/{project}/locks"

# Source of agent definitions (dpcli init renders them into .claude/agents/).
agents_dir: .dpcli/agents

# Roles of your own project agents (.claude/agents/*.md) — attach them to dpcli without changing their files.
# role: coordinator | executor | reviewer | status; review: whether a reviewer is needed after PASS (for executor).
# Overrides dpcli_role/dpcli_review from frontmatter. List with sources — dpcli agents.
# roles:
#   backend-dev: {role: executor, review: true}
#   code-reviewer: {role: reviewer}

# Path to the workflow description (links in dpcli task show and agent texts).
workflow: .claude/dpcli-workflow.md

# Documentation (dpcli docs): frontmatter check, index, registries.
docs:
  # Additional files to check (path patterns from the project root), besides {docs_dir}/**/*.md.
  extra: []
  # Exclusions (path patterns from root; * matches slashes too). Default — the archive.
  exclude:
    - "docs/archive/**"
  # Allowed type and status values in frontmatter.
  types: [guide, plan, contract, research, reference, journal, registry]
  statuses: [active, idea, postponed, closed, superseded]
  # Document size limit (KB); archive and generated files are not checked.
  max_kb: 40
  # error — exceeding the limit is a docs check error (exit 1); warn — warning only.
  max_kb_mode: error
  # Maximum summary length (chars, one line: conclusion/purpose of the document).
  summary_max: 140
  # Registries built by docs index: research, contracts, decisions
  # (decisions duplicates module journals — enable explicitly; decisions are found via dpcli search).
  registries: [research, contracts]
