# dpcli config. Goes in the project root as dpcli.yml (or dpcli.json; json wins).
# Searched upward from the current directory to the git root. All keys are optional — defaults shown below.
# Substitutions in path and branch templates: {project}, {module}, {task}, {copies}.

# Project name (default — the main worktree's directory name).
# project: myproject

# Main branch that modules are merged into.
main_branch: main
# true — dpcli merges (merge/deliver) into main_branch only with an explicit --into and only a module created from it:
# the normal way into main is an MR of the feature branch, merged by a human.
protect_main: false
# Module branch.
module_branch: "feature/{module}"
# Task branch (from the module branch).
task_branch: "{module}/{task}"

# Directory where working copies (git worktree) are created.
copies_dir: "~/worktrees"
# Module working copy.
module_copy: "{copies}/{project}/{module}"
# Task working copy.
task_copy: "{copies}/{project}/{module}-{task}"

# Preparing new working copies (module new, task new; to repeat — dpcli copy setup [PATH]).
# The copy is created with --no-checkout, git-crypt keys are copied into its GIT_DIR, then checkout.
# The source of the files below is the main copy (the first in git worktree list).
worktree:
  # Copy over a relative core.hooksPath (e.g. .husky/_) — it is git-ignored and empty in the copy.
  hooks: true
  # Git-ignored paths of the main copy. A pattern without "/" matches by name at any depth, with "/" — from the root.
  # Anything already in the copy, or whose directory is absent from the branch, is skipped; [] — turn off.
  # Hard links (cp -al; a copy on another filesystem): own tree, files shared with the main copy.
  link: [node_modules]
  # Plain copy.
  copy: [.env, ".env.*"]
  # bash command run after preparation: cwd — the new copy; env DPCLI_COPY, DPCLI_MAIN_COPY, DPCLI_BRANCH.
  # A failure does not roll back the copy. Example: "make prepare"
  # setup: "..."
  setup_timeout: 1800

# Language agents write in for people (replies, reports, journal, plans, docs) and the language of commit messages.
# Codes: en, ru, de, … (install.sh asks). CLI output is always English.
language:
  text: en
  commits: en

# Module journals and plans: <plan_dir>/<module>/ (cards, reports, events.jsonl, decisions.jsonl).
plan_dir: docs/plan
# Interface contracts: <contracts_dir>/<module>.md.
contracts_dir: docs/contracts
# Documentation directory (INDEX.md, registry/, frontmatter checks of dpcli docs).
docs_dir: docs
# Monorepo areas (module new --area): whose product goal the module serves; shared code in libs
# does not change area. If a list is set — module new/deliver refuse without area (the agent asks the developer),
# docs check requires area on a module's plan/contract/journal; INDEX.md sections follow this order. [] — not used.
areas: []

# Acceptance checks (dpcli accept).
checks:
  # Extra environment variables for check commands (none by default); {tmpdir} — a fresh temporary directory.
  # env:
  #   HOME_FOR_TESTS: "{tmpdir}"
  # Command template for checks like {tests: …}; {filter} — the test filter from the card.
  # Not set — the tests check is unavailable. Example: "python3 -m pytest -q -k {filter}"
  # tests: "python3 -m pytest -q -k {filter}"
  # Regex for the test-run summary of {tests: …} checks: groups (?P<total>…) and (?P<failed>…),
  # optionally (?P<skipped>…); the last match is used. No match — judged by exit code.
  # Default — "N tests, M failed[, K skipped]" (the Russian "N тестов, M упало" form is accepted too). Use single quotes for the regex (no \\ escaping).
  # tests_summary: '(?P<total>\d+) tests, (?P<failed>\d+) failed'
  # Where check logs are written: <log_dir>/<ID>/.
  log_dir: build/dpcli
  # accept goes to the background when its checks took longer than this last time, s (0 — never).
  bg_after: 100

# Where agents put screenshots and images (a hint in the report template); one subfolder per task.
artifacts_dir: build/artifacts

# Module delivery (dpcli deliver): what stays of <plan_dir>/<module>/ in the final branch after the squash
# (the rest of the journal lives only in the module branch) and the archive tag on the module branch (false — no tag; null — default).
deliver:
  keep: [decisions.md, summary.md]
  archive_tag: "archive/{module}"

# Reserved module codes (not issued by module new / task new).
reserved_codes: []

# dpcli gc: what not to count as "uncommitted changes" in copies when removing.
gc:
  ignore_dirs: [build, __pycache__]
  # File name patterns, e.g. ["*.uid"].
  ignore_globs: []

# Semantic search (dpcli index / dpcli search --sem) via Ollama.
sem:
  # Optional: off by default. To enable — enabled: true and Ollama with the model
  # (ollama pull bge-m3). Without it plain search works; merge does not touch the index.
  enabled: false
  model: bge-m3
  url: "http://localhost:11434"
  cache_dir: "~/.cache/dpcli/{project}"
  # Index corpus — path patterns from the project root.
  globs:
    - "docs/**/*.md"
    - "CHANGELOG.md"

# Long runs (dpcli job).
jobs:
  dir: "~/.cache/dpcli/{project}/jobs"
  # tmux session for task windows (the DPCLI_TMUX_SESSION variable overrides).
  tmux_session: dp
  # Slots in the cpu lock (default — half the logical cores; DPCLI_CPU_SLOTS overrides).
  # cpu_slots: 8

# Directory of dpcli lock cpu|gpu locks (default — <jobs.dir>/locks).
# locks: "~/.cache/dpcli/{project}/locks"

# Source of agent definitions (dpcli init renders them into .claude/agents/).
agents_dir: .dpcli/agents

# Roles of the project's own agents (.claude/agents/*.md) — hook them into dpcli without changing their files.
# role: coordinator | executor | reviewer | status; review: whether a reviewer is needed after PASS (for executor).
# Overrides dpcli_role/dpcli_review from frontmatter. List with sources — dpcli agents.
# roles:
#   backend-dev: {role: executor, review: true}
#   code-reviewer: {role: reviewer}

# Path to the process description (links in dpcli task show and agent texts).
workflow: .claude/dpcli-workflow.md

# Documentation (dpcli docs): frontmatter checks, index, registries.
docs:
  # Extra files to check (path patterns from the project root), besides {docs_dir}/**/*.md.
  extra: []
  # Exclusions (path patterns from the root; * also matches slashes). Default — the archive.
  exclude:
    - "docs/archive/**"
  # Allowed values of type and status in frontmatter.
  types: [guide, plan, contract, research, reference, journal, registry]
  statuses: [active, idea, postponed, closed, superseded]
  # Document size limit (KB); archive and generated files are not checked.
  max_kb: 40
  # error — exceeding the limit is a docs check error (exit 1); warn — a warning only.
  max_kb_mode: error
  # Maximum summary length (characters, one line: the document's conclusion/purpose).
  summary_max: 140
  # Registries built by docs index: research, contracts, decisions
  # (decisions duplicates module journals — enable explicitly; decisions are found with dpcli search).
  registries: [research, contracts]
